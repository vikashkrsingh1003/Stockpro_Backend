# Application Name
spring.application.name=${SPRING_APPLICATION_NAME}
spring.config.import=optional:file:.env[.properties]

# Server Port (next available after 8086)
server.port=${SERVER_PORT}

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# JPA Config
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS}

# Feign Client Timeouts
feign.client.config.default.connectTimeout=${FEIGN_CLIENT_CONFIG_DEFAULT_CONNECT_TIMEOUT}
feign.client.config.default.readTimeout=${FEIGN_CLIENT_CONFIG_DEFAULT_READ_TIMEOUT}

# JWT (same secret as all other services)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Actuator
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}

# Swagger / OpenAPI
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED}

# Logging
logging.level.org.springframework=${LOGGING_LEVEL_ORG_SPRINGFRAMEWORK}
logging.level.com.stockpro=${LOGGING_LEVEL_COM_STOCKPRO}

# App Info
info.app.name=${INFO_APP_NAME}
info.app.version=${INFO_APP_VERSION}
info.app.description=${INFO_APP_DESCRIPTION}


# RabbitMQ Config
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD}

# Don't crash if queues don't exist yet — keep retrying until publisher creates them
spring.rabbitmq.listener.simple.missing-queues-fatal=${SPRING_RABBITMQ_LISTENER_SIMPLE_MISSING_QUEUES_FATAL}
spring.rabbitmq.listener.simple.retry.enabled=${SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_ENABLED}
spring.rabbitmq.listener.simple.retry.initial-interval=${SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_INITIAL_INTERVAL}
spring.rabbitmq.listener.simple.retry.max-attempts=${SPRING_RABBITMQ_LISTENER_SIMPLE_RETRY_MAX_ATTEMPTS}


# Analytics Queue Names
analytics.queue.stock-movement=${ANALYTICS_QUEUE_STOCK_MOVEMENT}
analytics.exchange=${ANALYTICS_EXCHANGE}
