spring.application.name=${SPRING_APPLICATION_NAME}
spring.config.import=optional:file:.env[.properties]


jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}


# ===============================
# DATABASE CONFIG
# ===============================

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME}

# ===============================
# JPA / HIBERNATE
# ===============================

spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL}

# ===============================
# SERVER
# ===============================
server.port=${SERVER_PORT}

# ===============================
# EUREKA
# ===============================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
eureka.client.register-with-eureka=${EUREKA_CLIENT_REGISTER_WITH_EUREKA}
eureka.client.fetch-registry=${EUREKA_CLIENT_FETCH_REGISTRY}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS}
eureka.instance.instance-id=${spring.application.name}:${server.port}

#===============================
#Actuator
#===============================
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE}
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS}
info.app.name=${INFO_APP_NAME}
info.app.version=${INFO_APP_VERSION}
info.app.description=${INFO_APP_DESCRIPTION}
#===============================
#Swagger / OpenAPI
#===============================
springdoc.api-docs.path=${SPRINGDOC_API_DOCS_PATH}
springdoc.swagger-ui.path=${SPRINGDOC_SWAGGER_UI_PATH}
springdoc.swagger-ui.enabled=${SPRINGDOC_SWAGGER_UI_ENABLED}

#===============================
# Gateway Integration
#===============================
server.forward-headers-strategy=${SERVER_FORWARD_HEADERS_STRATEGY}

#===============================
# OAuth2 - Google
#===============================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=${GOOGLE_CLIENT_SCOPE}
spring.security.oauth2.client.registration.google.redirect-uri=https://13.232.138.180:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.redirect-uri=https://stockpro-frontend.netlify.app/login/oauth2/code/google
stockpro.frontend.oauth2-success-url=${STOCKPRO_FRONTEND_OAUTH2_SUCCESS_URL}

#===============================
# Email OTP - Gmail SMTP
# Set STOCKPRO_MAIL_USERNAME to your Gmail address and
# STOCKPRO_MAIL_PASSWORD to your Gmail app password.
#===============================
stockpro.otp.expiry-minutes=${STOCKPRO_OTP_EXPIRY_MINUTES}
stockpro.mail.enabled=${STOCKPRO_MAIL_ENABLED}
spring.mail.host=${SPRING_MAIL_HOST}
spring.mail.port=${SPRING_MAIL_PORT}
spring.mail.username=${STOCKPRO_MAIL_USERNAME}
spring.mail.password=${STOCKPRO_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE}
spring.mail.properties.mail.smtp.starttls.required=${SPRING_MAIL_SMTP_STARTTLS_REQUIRED}
spring.mail.properties.mail.smtp.ssl.trust=${SPRING_MAIL_SMTP_SSL_TRUST}
spring.mail.properties.mail.smtp.connectiontimeout=${SPRING_MAIL_SMTP_CONNECTION_TIMEOUT}
spring.mail.properties.mail.smtp.timeout=${SPRING_MAIL_SMTP_TIMEOUT}
spring.mail.properties.mail.smtp.writetimeout=${SPRING_MAIL_SMTP_WRITE_TIMEOUT}
