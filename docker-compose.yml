# ============================================================
# StockPro — Docker Compose
# PDF §7 Containerisation: Docker with Docker Compose
# Run from: e:\myproject\sprintproject\stockpro\
# Command:  docker-compose up --build
# ============================================================

x-memory-small: &memory-small
  mem_limit: 256m
  memswap_limit: 256m

x-memory-medium: &memory-medium
  mem_limit: 288m
  memswap_limit: 288m

x-memory-large: &memory-large
  mem_limit: 320m
  memswap_limit: 320m

services:

  # ──────────────────────────────────────
  # INFRASTRUCTURE — MySQL & RabbitMQ
  # No code needed — pulled from Docker Hub
  # ──────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: stockpro-mysql
    profiles:
      - local-db
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
      - --table-open-cache=200
      - --key-buffer-size=8M
      - --tmp-table-size=32M
      - --max-heap-table-size=32M
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - stockpro-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: stockpro-rabbitmq
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - stockpro-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  sonarqube:
    image: sonarqube:community
    container_name: stockpro-sonarqube
    profiles:
      - tools
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    networks:
      - stockpro-network

  # ──────────────────────────────────────
  # SERVICE DISCOVERY — Eureka (starts first)
  # ──────────────────────────────────────

  eureka-service:
    <<: *memory-small
    build: ./eureka-service
    container_name: stockpro-eureka
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - SPRING_APPLICATION_NAME=eureka-service
      - SERVER_PORT=8761
      - EUREKA_CLIENT_REGISTER_WITH_EUREKA=false
      - EUREKA_CLIENT_FETCH_REGISTRY=false
    ports:
      - "8761:8761"
    networks:
      - stockpro-network
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────
  # BACKEND MICROSERVICES
  # ──────────────────────────────────────

  authservice:
    <<: *memory-small
    build: ./authservice
    container_name: stockpro-auth
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8081:8081"
    environment:
      - SPRING_APPLICATION_NAME=authservice
      - SERVER_PORT=8081
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT:-3306}/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - STOCKPRO_ALERT_LOW_STOCK_THRESHOLD=20
      - STOCKPRO_FRONTEND_OAUTH2_SUCCESS_URL=https://stockpro-frontend.netlify.app/oauth2/callback
      - SERVER_TOMCAT_THREADS_MAX=50
      - SERVER_TOMCAT_THREADS_MIN_SPARE=5
    depends_on:
      eureka-service:
        condition: service_healthy
    networks:
      - stockpro-network

  product-service:
    <<: *memory-small
    build: ./product-service
    container_name: stockpro-product
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8082:8082"
    environment:
      - SPRING_APPLICATION_NAME=product-service
      - SERVER_PORT=8082
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT:-3306}/stockpro_product?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - SERVER_TOMCAT_THREADS_MAX=50
      - SERVER_TOMCAT_THREADS_MIN_SPARE=5
    depends_on:
      eureka-service:
        condition: service_healthy
    networks:
      - stockpro-network

  warehouse-service:
    <<: *memory-small
    build: ./warehouse-service
    container_name: stockpro-warehouse
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8083:8083"
    environment:
      - SPRING_APPLICATION_NAME=warehouse-service
      - SERVER_PORT=8083
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT:-3306}/stockpro_warehouse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - SERVER_TOMCAT_THREADS_MAX=50
      - SERVER_TOMCAT_THREADS_MIN_SPARE=5
    depends_on:
      eureka-service:
        condition: service_healthy
    networks:
      - stockpro-network

  purchase-service:
    <<: *memory-medium
    build: ./purchase-service
    container_name: stockpro-purchase
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8084:8084"
    environment:
      - SPRING_APPLICATION_NAME=purchase-service
      - SERVER_PORT=8084
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT:-3306}/stockpro_purchase_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - STOCKPRO_INTERNAL_SERVICE_TOKEN=stockpro-internal-token
      - PAYMENT_SERVICE_BASE_URL=http://payment-service:8089/api/v1/payments
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SERVER_TOMCAT_THREADS_MAX=50
      - SERVER_TOMCAT_THREADS_MIN_SPARE=5
    depends_on:
      eureka-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - stockpro-network

  payment-service:
    <<: *memory-small
    build: ./payment-service
    container_name: stockpro-payment
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8089:8089"
    environment:
      - SPRING_APPLICATION_NAME=payment-service
      - SERVER_PORT=8089
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT:-3306}/stockpro_payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - STOCKPRO_INTERNAL_SERVICE_TOKEN=stockpro-internal-token
      - PURCHASE_SERVICE_BASE_URL=http://purchase-service:8084/api/v1/purchase-orders
      - SERVER_TOMCAT_THREADS_MAX=50
      - SERVER_TOMCAT_THREADS_MIN_SPARE=5
    depends_on:
      eureka-service:
        condition: service_healthy
      purchase-service:
        condition: service_started
    networks:
      - stockpro-network

  supplier-service:
    <<: *memory-small
    build: ./supplier-service
    container_name: stockpro-supplier
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8085:8085"
    environment:
      - SPRING_APPLICATION_NAME=supplier-service
      - SERVER_PORT=8085
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT:-3306}/stockpro_supplier?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - SERVER_TOMCAT_THREADS_MAX=50
      - SERVER_TOMCAT_THREADS_MIN_SPARE=5
    depends_on:
      eureka-service:
        condition: service_healthy
    networks:
      - stockpro-network

  stockmovement-services:
    <<: *memory-medium
    build: ./stockmovement-services
    container_name: stockpro-movement
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8086:8086"
    environment:
      - SPRING_APPLICATION_NAME=stockmovement-services
      - SERVER_PORT=8086
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT:-3306}/stockpro_movements?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - STOCKPRO_ALERT_EMAIL_TO=${STOCKPRO_ALERT_EMAIL_TO}
      - STOCKPRO_INTERNAL_SERVICE_TOKEN=stockpro-internal-token
      - PAYMENT_SERVICE_BASE_URL=http://payment-service:8089/api/v1/payments
      - SERVER_TOMCAT_THREADS_MAX=50
      - SERVER_TOMCAT_THREADS_MIN_SPARE=5
    depends_on:
      eureka-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - stockpro-network

  analytics-service:
    <<: *memory-large
    build: ./analytics-service
    container_name: stockpro-analytics
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8087:8087"
    environment:
      - SPRING_APPLICATION_NAME=analytics-service
      - SERVER_PORT=8087
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT:-3306}/stockpro_analytics_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - SERVER_TOMCAT_THREADS_MAX=50
      - SERVER_TOMCAT_THREADS_MIN_SPARE=5
    depends_on:
      eureka-service:
        condition: service_healthy
    networks:
      - stockpro-network

  alert-service:
    <<: *memory-small
    build: ./alert-service
    container_name: stockpro-alert
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8088:8088"
    environment:
      - SPRING_APPLICATION_NAME=alert-service
      - SERVER_PORT=8088
      - SPRING_DATASOURCE_URL=jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT:-3306}/stockpro_alert_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=${RDS_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${RDS_PASSWORD}
      - SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE=4
      - SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE=1
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - STOCKPRO_FRONTEND_DASHBOARD_URL=https://stockpro-frontend.netlify.app/dashboard
      - SERVER_TOMCAT_THREADS_MAX=50
      - SERVER_TOMCAT_THREADS_MIN_SPARE=5
    depends_on:
      eureka-service:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - stockpro-network

  # ──────────────────────────────────────
  # API GATEWAY — Entry point for all requests
  # ──────────────────────────────────────

  api-gateway:
    <<: *memory-large
    build: ./api-gateway
    container_name: stockpro-gateway
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8080:8080"
    environment:
      - SPRING_APPLICATION_NAME=gateway-service
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-service:8761/eureka/
      - GATEWAY_CORS_ALLOWED_ORIGINS=http://localhost:4200,http://localhost:4201,https://stockpro-frontend.netlify.app
    depends_on:
      eureka-service:
        condition: service_healthy
    networks:
      - stockpro-network
  # ──────────────────────────────────────
  # FRONTEND —
  # Path goes up one level to stockproFrontend
  # ──────────────────────────────────────

  # frontend:
  #   build: ../stockproFrontend/stockProFrontend
  #   container_name: stockpro-frontend
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #   depends_on:
  #     - api-gateway
  #   networks:
  #     - stockpro-network

  # ──────────────────────────────────────
  # VOLUMES & NETWORKS
  # ──────────────────────────────────────

volumes:
  mysql_data:
    driver: local
  sonarqube_data:
    driver: local
  sonarqube_extensions:
    driver: local
  sonarqube_logs:
    driver: local

networks:
  stockpro-network:
    driver: bridge
